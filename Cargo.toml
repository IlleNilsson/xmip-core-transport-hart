[package]
name = "xmip-core-transport-hart"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-hart"
description = "HART transport: the field device protocol on the 4-20 mA loop — short and long frames with an XOR checksum, commands 0 and 1, a Stream written and read in chunks through device-specific commands, burst mode taken as it comes; over a modem's serial port, or field devices on the SDK's simulated multi-drop bus. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). HART is a dozen bytes and an XOR on a 1200-baud
# line; the line is the capability's, carried by a modem on a serial port or
# by the SDK's simulated multi-drop bus (open problem 24). Its declaration
# takes the capability's `timeout` (`transport::configured::timeout`).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The names what this technology observed of a sender travels under, which
# the identity gates read (`context::property`, ADR-0019 amendment
# 2026-10-06).
context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main", optional = true }
# A target read as a URI writes it (`net::Target`).
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main", optional = true }
# The `0x` number a target names (`codec::hex`).
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main", optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
sdk = { package = "xmip-core-sdk", git = "https://github.com/IlleNilsson/xmip-core-sdk", branch = "main", optional = true }
# The modem's serial port a Location names, framed by the length a frame
# says (`Framing::Measured`), as M-Bus reads its port.
serial = { package = "xmip-core-transport-serial", git = "https://github.com/IlleNilsson/xmip-core-transport-serial", branch = "main", optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:context", "dep:net", "dep:codec", "dep:sdk", "dep:serial"]
# The declaration alone, with the wait its default names.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main", features = ["test-support"] }

[lints]
workspace = true
